# Known vulnerabilities in development dependencies that cannot be fixed on
# this branch without a major upgrade. None of them is in a runtime
# dependency of a published package. Each entry expires, so it is reviewed.
# Tracked in https://github.com/ts-graphviz/ts-graphviz/issues/1863

# Vitest 3 (test runner): fixed in Vitest 4, which the next major uses.
[[IgnoredVulns]]
id = "GHSA-82fw-gwwq-j7x9"
ignoreUntil = 2027-01-31
reason = "Vitest/@vitest/mocker dev server only; tests run locally and in CI on trusted code. Fixed by the Vitest 4 upgrade."


# uuid 8/9 (pulled in by @pnpm/workspace.find-packages for the e2e scripts and
# by Docusaurus for the website): the fix is in uuid 11, a major upgrade of
# their dependency; the affected functions are not called with a buffer here.
[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2027-01-31
reason = "Build/e2e tooling only; the affected v3/v5/v6 buffer API is not used by this repository. Fix requires uuid 11 in third-party dependencies."


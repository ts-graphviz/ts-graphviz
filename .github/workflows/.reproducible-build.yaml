name: Reproducible Build
on:
  workflow_call:

permissions:
  contents: read

# Builds and packs every publishable package twice, in two separate jobs
# (clean checkouts, different runners), and fails if any tarball differs.
# `pnpm pack:check` runs the same check locally; SECURITY.md explains how
# a user rebuilds a release and compares it with the npm tarball.
jobs:
  pack:
    name: Build and pack (${{ matrix.round }} build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        round: [first, second]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Generated code is built here too, not downloaded from the codegen
      # job, so that each build starts from the checkout alone.
      - name: Generate code
        run: pnpm codegen
      - name: Build
        run: pnpm build
      # Packs as `pnpm publish` would and writes SHA256SUMS;
      # SOURCE_DATE_EPOCH is set from the commit by the script.
      - name: Pack
        run: pnpm pack:check pack packed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-${{ matrix.round }}
          path: packed
          if-no-files-found: error

  compare:
    name: Compare the two builds
    runs-on: ubuntu-latest
    needs:
      - pack
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./.node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-first
          path: first
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-second
          path: second
      # Needs no dependencies: the script uses Node.js and tar only.
      - name: Compare
        run: node scripts/pack-check.ts compare first second

# An experiment for #1841: the time and memory of type checks before and
# after the schema PRs. Runs on pushes to this perf/ branch only; not for
# next. Each matrix ref is a commit of next or of a schema PR.
name: Schema type-check measurements
on:
  push:
    branches:
      - perf/schema-types

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.ref.label }} (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        check:
          - native
          - ts6
          - consumer
        ref:
          - label: next 856bb0df
            sha: 856bb0df8afc5f609ce4698d30d657327dea87fc
          - label: PR 1 v3 (default kit types)
            sha: 3b35db2664dc9e2e8bf799146717dbe917576327
          - label: PR 2 (defineSchema)
            sha: 5285bfae4276b5ab5b194ffba401d7403fefe3fe
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref.sha }}
          path: target
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: target/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
          node-version-file: target/.node-version
      - run: pnpm install --frozen-lockfile
        working-directory: target
      - run: pnpm codegen
        working-directory: target
      - if: matrix.check == 'consumer'
        run: pnpm build
        working-directory: target
      - name: Measure
        working-directory: target
        env:
          CHECK: ${{ matrix.check }}
          LABEL: ${{ matrix.ref.label }}
          ROW: row-${{ strategy.job-index }}
        run: |
          sudo systemd-run --scope --quiet -p MemoryMax=8G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" --setenv=PATH="$PATH" --setenv=LABEL="$LABEL" --working-directory="$PWD" \
            ../tools/bench/schema-types/measure.sh "$CHECK" "../$ROW.md"
          mv "$CHECK.log" "../$ROW.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: row-${{ strategy.job-index }}
          path: row-${{ strategy.job-index }}.*

  summary:
    name: Summary
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: row-*
          merge-multiple: true
      - name: Table
        run: |
          {
            echo '| ref | check | result | wall | peak RSS | check time | memory used | instantiations |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
            sort row-*.md
          } >> "$GITHUB_STEP_SUMMARY"

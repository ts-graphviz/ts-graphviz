name: Nightly Property Tests and Fuzzing
# A long run of the property-based tests in test/properties and the
# differential tests in test/differential (#1642): many more cases
# than a pull request run, to catch inputs the default 200 cases miss. The
# seed of a failing property is in the log; reproduce with FC_SEED=<seed>.
# Plus coverage-guided fuzzing of the targets in fuzz/targets (#1600), and
# mutation testing of the packages with StrykerJS (#1860).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      num_runs:
        description: Number of cases per property (FC_NUM_RUNS)
        default: '5000'
        type: string
      fuzz_seconds:
        description: Seconds of fuzzing per fuzz target
        default: '900'
        type: string

permissions:
  contents: read

jobs:
  properties:
    name: Properties (${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `main` joins the list once the property tests are released with v4
        ref: [next]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate code
        run: pnpm codegen
      - name: Run the property and differential tests
        env:
          FC_NUM_RUNS: ${{ inputs.num_runs || '5000' }}
        run: pnpm vitest run test/properties test/differential --coverage.enabled=false --tags-filter='!process'
      # The differential tests run the Graphviz binaries (tag `process`):
      # in a container with Graphviz, no network and the allowlisted
      # environment of scripts/test-sandbox.ts (FC_NUM_RUNS among it).
      - name: Run the tests that start processes in a container
        env:
          FC_NUM_RUNS: ${{ inputs.num_runs || '5000' }}
        run: pnpm test:sandbox test/properties test/differential

  fuzz:
    # Coverage-guided fuzzing with Jazzer.js (#1600): each target in
    # fuzz/targets runs for `fuzz_seconds`; findings are uploaded and fail the
    # job. Reproduce locally with `pnpm fuzz:build && pnpm fuzz <target>`.
    name: Fuzz ${{ matrix.target }} (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [next]
        target: [parse, model, sanitize, adapter-args]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate code
        run: pnpm codegen
      - name: Build the fuzz targets
        run: pnpm fuzz:build
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.fuzz_seconds || '900' }}
        run: pnpm fuzz "$TARGET" "$SECONDS_PER_TARGET"
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz/findings/
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    # Mutation testing with StrykerJS (#1860): one test run per mutant of
    # packages/*/src, so nightly rather than on pull requests, and one job
    # per group of packages (STRYKER_SCOPE, stryker.config.mjs) so that a
    # run without an incremental file fits the time limit. The incremental
    # file of the last run is cached: a run re-tests only the mutants whose
    # source or tests changed. The tests tagged `process` are left out
    # (vitest.mutation.config.ts), so no Graphviz or container is needed.
    # A mutation score under `thresholds.break` fails the job; the report
    # (reports/mutation/index.html) is uploaded either way.
    name: Mutation testing ${{ matrix.scope }} (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ref: [next]
        scope: [common-core, ast-dot-shim, ast-rest, adapter-react]
        include:
          - scope: common-core
            mutate: common,core,ts-graphviz
          - scope: ast-dot-shim
            mutate: ast/dot-shim
          - scope: ast-rest
            mutate: ast,!ast/dot-shim
          - scope: adapter-react
            mutate: adapter,react
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate code
        run: pnpm codegen
      # The key is unique per run, so the restore falls back to the latest
      # file of this scope and the save below always writes a new one.
      - name: Restore the incremental file of the last run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental.json
          key: mutation-${{ matrix.ref }}-${{ matrix.scope }}-${{ github.run_id }}
          restore-keys: |
            mutation-${{ matrix.ref }}-${{ matrix.scope }}-
      - name: Run mutation testing
        env:
          STRYKER_SCOPE: ${{ matrix.mutate }}
        run: pnpm test:mutation
      # Also after a failed threshold, so that the next run stays incremental
      - name: Save the incremental file
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental.json
          key: mutation-${{ matrix.ref }}-${{ matrix.scope }}-${{ github.run_id }}
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.scope }}-${{ matrix.ref }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

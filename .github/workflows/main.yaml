name: Main
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codegen:
    name: Code Generation
    uses: ./.github/workflows/.codegen.yaml

  check:
    name: Check
    uses: ./.github/workflows/.check.yaml

  build:
    name: Build
    uses: ./.github/workflows/.build.yaml
    needs:
      - codegen

  unit_test:
    name: Unit Test
    uses: ./.github/workflows/.unit-test.yaml
    needs:
      - codegen

  e2e_test:
    name: E2E Test
    uses: ./.github/workflows/.e2e-test.yaml
    needs:
      - build

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    needs:
      - check
      - build
      - unit_test
      - e2e_test
    if: ${{ github.repository == 'ts-graphviz/ts-graphviz' && github.ref == 'refs/heads/main' && success() }}
    permissions:
      contents: write # Used to commit to "Version Packages" PR
      pull-requests: write # Used to create "Version Packages" PR
      id-token: write # Used to publish to npm with OIDC trusted publishing
      # Other permissions are defaulted to none
    env:
      # A pull request opened with GITHUB_TOKEN starts no workflows, so the
      # "Version Packages" PR would be merged without CI. A GitHub App token
      # is used when the app is configured; until then GITHUB_TOKEN is used.
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_CLIENT_ID != '' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: lib
          path: packages
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Setup Node.js
        # The Node.js of .node-version (24) bundles npm 11, which publishes
        # with OIDC trusted publishing, so npm is not installed separately
        # (an install by version cannot be pinned by hash).
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the npm CLI supports trusted publishing
        run: npm --version && node -e "const [ma,mi]=process.argv[1].split('.').map(Number); if (ma < 11 || (ma === 11 && mi < 5)) { console.error('npm >= 11.5 is required for OIDC trusted publishing'); process.exit(1) }" "$(npm --version)"
      - name: Create a token that starts CI on the release pull request
        id: app-token
        if: ${{ env.HAS_RELEASE_APP == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@3de3850952bec538fde60aac71731376e57b9b57 # v1.4.8
        with:
          publish: pnpm exec changeset publish
          version: pnpm exec changeset version
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Switch back to main branch
        run: git checkout main
      - name: Check current branch
        id: branch_check
        run: echo "current_branch=$(git branch --show-current)" >> $GITHUB_OUTPUT
      - name: Publish npm package with @next tag
        if: ${{ steps.changesets.outputs.published != 'true' && steps.branch_check.outputs.current_branch == 'main' && github.actor != 'dependabot[bot]'}}
        run: |
          pnpm exec changeset version --snapshot next
          pnpm exec changeset publish --no-git-tag --snapshot --tag next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}

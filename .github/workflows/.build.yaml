name: Build Artifact
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lib:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-code
          path: packages/ast/src/dot-shim/parser
      - name: Build
        run: pnpm build
      - name: Type Check (Strict)
        run: pnpm typecheck:strict
      - name: Type Check (Tests, examples and tooling)
        run: pnpm typecheck
      - name: Check packages as they would be published
        run: pnpm check:packages
      # Type-checks test/consumer/ against the packed packages with
      # TypeScript 5.0, 6.0 and 7.0 and several module settings.
      - name: Type-check the packages as users install them
        run: pnpm check:consumer-types
      # api-reports/ holds the public API of every entry point; a change of a
      # public type must come with the updated report (`pnpm api:update`).
      - name: Check the public API against api-reports/
        run: |
          pnpm api:update
          git add --intent-to-add api-reports
          git diff --exit-code -- api-reports
      - name: Type-check the code examples of the docs
        run: pnpm check:doc-examples
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: |
            packages/**/lib
          name: lib

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-code
          path: packages/ast/src/dot-shim/parser
      - name: Documentation Build
        run: pnpm doc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: doc
          name: doc

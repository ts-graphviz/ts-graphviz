name: Website
# Builds the documentation site (website/) together with the API reference
# (typedoc) from the same commit, and publishes it to the gh-pages branch of
# ts-graphviz/ts-graphviz.github.io, the organization Pages repository.
# The site's content follows `main`; edits for the next major happen on the
# development branch and go live when it is merged.
on:
  push:
    branches:
      - main
    paths:
      - website/**
      - packages/**
      - typedoc.json
      - tsconfig.doc.json
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/website.yaml
  pull_request:
    # keep in sync with push.paths: every input of the build
    paths:
      - website/**
      - packages/**
      - typedoc.json
      - tsconfig.doc.json
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/website.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - name: Checkout Repo
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate code
        run: pnpm codegen
      - name: Build packages
        run: pnpm build
      - name: Build the API reference
        run: pnpm doc
      - name: Build the site
        run: pnpm --filter @ts-graphviz/website build
      - name: Add the API reference under /api/
        run: pnpm --filter @ts-graphviz/website copy-api
      - name: Check internal links of the built site
        run: pnpm --filter @ts-graphviz/website check-links
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: website/build

  deploy:
    name: Deploy to ts-graphviz.github.io
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ github.repository == 'ts-graphviz/ts-graphviz' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    environment:
      name: website
      url: https://ts-graphviz.github.io/
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: website
          path: build
      - name: Push to the gh-pages branch of ts-graphviz.github.io
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          # A write-enabled deploy key of ts-graphviz/ts-graphviz.github.io
          deploy_key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: ts-graphviz/ts-graphviz.github.io
          publish_branch: gh-pages
          publish_dir: ./build
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: 'deploy: ts-graphviz/ts-graphviz@${{ github.sha }}'

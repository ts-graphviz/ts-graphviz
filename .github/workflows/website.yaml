name: Website
# Builds the documentation site (website/) together with the API reference
# (typedoc) from the same commit, and publishes it to the gh-pages branch of
# ts-graphviz/ts-graphviz.github.io, the organization Pages repository.
# The site's content follows `main`; edits for the next major happen on the
# development branch and go live when it is merged.
#
# The site is published only while `main` has no pending changesets, that is
# while the packages on `main` are the ones on npm. Otherwise the guide and
# the API reference would describe changes that are not released yet. Changes
# merged meanwhile (a blog post, a typo fix) go live with the release: the
# Version Packages commit consumes the changesets and touches packages/**,
# which runs this workflow. To publish before that, run the workflow by hand
# with `ignore-pending-changesets`.
on:
  push:
    branches:
      - main
    paths:
      - website/**
      - packages/**
      - typedoc.json
      - typedoc.css
      - tsconfig.doc.json
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/website.yaml
  pull_request:
    # keep in sync with push.paths: every input of the build
    paths:
      - website/**
      - packages/**
      - typedoc.json
      - typedoc.css
      - tsconfig.doc.json
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/workflows/website.yaml
  workflow_dispatch:
    inputs:
      ignore-pending-changesets:
        description: Publish even though main has changes that are not released yet
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main a newer push must not cancel the run of a release: it may be one
  # that cannot publish (a pending changeset), and the site would wait for the
  # next release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.pending.outputs.released }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for changes that are not released yet
        id: pending
        env:
          IGNORE_PENDING_CHANGESETS: ${{ inputs.ignore-pending-changesets }}
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | sort)
          if [ -z "$pending" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            # The deploy job publishes from main only.
            if [ "$IGNORE_PENDING_CHANGESETS" = "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              heading="To be published with ignore-pending-changesets, although these changesets are not released yet."
            else
              heading="Not published: these changesets are not released yet."
            fi
            {
              echo "$heading"
              echo "$pending" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          cache: pnpm
          node-version-file: ./.node-version
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate code
        run: pnpm codegen
      - name: Build packages
        run: pnpm build
      - name: Type check the site
        run: pnpm --filter @ts-graphviz/website typecheck
      - name: Unit and component tests of the site
        run: pnpm --filter @ts-graphviz/website test
      - name: Build the API reference
        run: pnpm doc
      - name: Build the site
        run: pnpm --filter @ts-graphviz/website build
      - name: Add the API reference under /api/
        run: pnpm --filter @ts-graphviz/website copy-api
      - name: Check internal links of the built site
        run: pnpm --filter @ts-graphviz/website check-links
      - name: Install browsers for the end-to-end tests
        run: pnpm --filter @ts-graphviz/website exec playwright install --with-deps chromium webkit
      - name: End-to-end tests of the built site (desktop and phones)
        run: pnpm --filter @ts-graphviz/website test:e2e
      - uses: actions/upload-artifact@84480863f228bb9747b473957fcc9e309aa96097 # v4.4.2
        if: ${{ failure() }}
        with:
          name: website-e2e-results
          path: website/test-results
          retention-days: 7
      - uses: actions/upload-artifact@84480863f228bb9747b473957fcc9e309aa96097 # v4.4.2
        with:
          name: website
          path: website/build

  deploy:
    name: Deploy to ts-graphviz.github.io
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ github.repository == 'ts-graphviz/ts-graphviz' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.build.outputs.released == 'true' || inputs.ignore-pending-changesets) }}
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    environment:
      name: website
      url: https://ts-graphviz.github.io/
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: website
          path: build
      - name: Push to the gh-pages branch of ts-graphviz.github.io
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          # A write-enabled deploy key of ts-graphviz/ts-graphviz.github.io
          deploy_key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: ts-graphviz/ts-graphviz.github.io
          publish_branch: gh-pages
          publish_dir: ./build
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: 'deploy: ts-graphviz/ts-graphviz@${{ github.sha }}'

version: 2
updates:
  # The pnpm workspace (all packages, e2e and examples) is managed from the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give the community time to detect compromised releases before they are
    # proposed. This must stay above pnpm's `minimumReleaseAge` (1 day) so the
    # lockfile Dependabot generates passes `pnpm install` in CI.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # The documentation site: Docusaurus and the playground move as one group.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      website:
        patterns:
          - '*'

  # The Node.js base images of `pnpm test:sandbox`, pinned by digest. One
  # stage per Node.js major: only digest and minor/patch updates.
  - package-ecosystem: docker
    directory: /test/sandbox
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      sandbox-images:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
